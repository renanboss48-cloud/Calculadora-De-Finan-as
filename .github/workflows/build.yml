name: Gerar executáveis

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m unittest

  windows-exe:
    needs: testes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --windowed --name CalculadoraFinanceira app.py
      - uses: actions/upload-artifact@v4
        with:
          name: CalculadoraFinanceira-exe
          path: dist/CalculadoraFinanceira.exe

  android-apk:
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: pip install flet==0.28.3
      - run: flet build apk --verbose < <(yes)
      - uses: actions/upload-artifact@v4
        with:
          name: CalculadoraFinanceira-apk
          path: build/apk/*.apk
